<style>
/* Layout: a night terminal. Goldie sits on a steel beam at left, pointing at a Solari split-flap board at right; both rest on a hazard-striped barrier. Stacks to one column on phones. */
:root {
  --ground: #0C2125;      /* night terminal teal-black */
  --ground-2: #13343A;    /* spotlight teal */
  --housing: #0E0F10;     /* board cabinet */
  --flap: #1C1D1F;        /* flap face */
  --flap-edge: #2A2B2E;
  --glyph: #F3EAD0;       /* warm cream letters */
  --gold: #C9A24A;        /* wings gold */
  --muted: #9DB1AE;
  --hazard: #E6B422;
  --hazard-ink: #121212;
  --display: "Yellowtail", "Brush Script MT", cursive;
  --board: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: radial-gradient(ellipse 70% 60% at 30% 40%, var(--ground-2), var(--ground) 70%) var(--ground);
  color: var(--glyph);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  padding-inline: 16px;
  padding-block: 28px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.wrap { width: 100%; max-width: 1180px; display: flex; flex-direction: column; gap: 28px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.mark { font-family: var(--display); font-size: clamp(30px, 4vw, 44px); color: var(--gold); line-height: 1; text-decoration: none; }
.code { font-family: var(--board); font-weight: 600; letter-spacing: .18em; text-transform: uppercase; font-size: 14px; color: var(--muted); }

.stage { display: grid; grid-template-columns: minmax(0, 0.62fr) minmax(0, 1.38fr); align-items: end; gap: clamp(8px, 2vw, 28px); }
.goldie { display: flex; justify-content: flex-end; align-items: flex-end; min-width: 0; }
.goldie img { display: block; width: 100%; max-width: 360px; height: auto; filter: drop-shadow(0 18px 30px rgba(0,0,0,.45)); }

.side { display: flex; flex-direction: column; gap: 24px; min-width: 0; padding-bottom: clamp(16px, 3vw, 40px); }

/* The board */
.board {
  --bw: clamp(17px, 3.1vw, 42px);
  --bh: calc(var(--bw) * 1.5);
  --sw: clamp(11px, 1.55vw, 21px);
  --sh: calc(var(--sw) * 1.5);
  background: linear-gradient(var(--housing), #08090A);
  border-radius: 6px;
  padding: clamp(12px, 2vw, 22px);
  box-shadow: 0 2px 0 #26292c inset, 0 30px 60px rgba(0,0,0,.5), 0 0 0 1px #000;
  display: flex; flex-direction: column; gap: clamp(10px, 1.4vw, 16px);
  cursor: pointer;
  width: max-content;
  align-self: flex-start;
  max-width: 100%;
  overflow: hidden;
}
.board:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
.board-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-family: var(--board); font-weight: 600; letter-spacing: .22em; font-size: clamp(11px, 1.2vw, 14px); color: var(--gold); text-transform: uppercase; border-bottom: 1px solid #23262a; padding-bottom: 8px; }
.board-head .clock { font-variant-numeric: tabular-nums; color: var(--glyph); letter-spacing: .12em; }
.rows { display: flex; flex-direction: column; gap: clamp(4px, .6vw, 7px); }
.row { display: flex; gap: clamp(2px, .3vw, 4px); }
.remarks { display: flex; align-items: center; gap: 12px; border-top: 1px solid #23262a; padding-top: 10px; flex-wrap: wrap; }
.remarks .label { font-family: var(--board); font-weight: 600; letter-spacing: .22em; font-size: clamp(11px, 1.2vw, 14px); color: var(--muted); text-transform: uppercase; }
.remarks .row { gap: 2px; }

.flap { position: relative; width: var(--bw); height: var(--bh); perspective: calc(var(--bh) * 4); font-family: var(--board); font-weight: 700; font-size: calc(var(--bh) * .74); color: var(--glyph); flex: none; }
.small .flap { width: var(--sw); height: var(--sh); font-size: calc(var(--sh) * .74); color: var(--hazard); }
.flap .h { position: absolute; left: 0; right: 0; height: 50%; overflow: hidden; background: var(--flap); backface-visibility: hidden; }
.flap .t, .flap .ft { top: 0; border-radius: 3px 3px 0 0; background: linear-gradient(#232427, var(--flap)); }
.flap .b, .flap .fb { bottom: 0; border-radius: 0 0 3px 3px; background: linear-gradient(var(--flap), #161718); }
.flap .h i { display: block; font-style: normal; height: var(--bh); line-height: var(--bh); text-align: center; }
.small .flap .h i { height: var(--sh); line-height: var(--sh); }
.flap .b i, .flap .fb i { transform: translateY(-50%); }
.flap::after { content: ""; position: absolute; left: 0; right: 0; top: calc(50% - .5px); height: 1px; background: #000; z-index: 5; }
.flap .ft { transform-origin: 50% 100%; z-index: 3; visibility: hidden; }
.flap .fb { transform-origin: 50% 0; z-index: 4; visibility: hidden; transform: rotateX(90deg); }
.flap.go .ft { visibility: visible; animation: ft var(--d, 70ms) ease-in forwards; }
.flap.go .fb { visibility: visible; animation: fb var(--d, 70ms) ease-out var(--d, 70ms) forwards; }
@keyframes ft { from { transform: rotateX(0); } to { transform: rotateX(-90deg); } }
@keyframes fb { from { transform: rotateX(90deg); } to { transform: rotateX(0); } }

/* Construction barrier the scene rests on */
.barrier { height: 22px; width: 100%; background: repeating-linear-gradient(-45deg, var(--hazard) 0 22px, var(--hazard-ink) 22px 44px); box-shadow: 0 -6px 0 #6E7A80, 0 -9px 0 #4D575C; }
.stage-wrap { display: flex; flex-direction: column; }

.note { display: flex; flex-direction: column; gap: 14px; max-width: 60ch; }
.note h1 { font-family: var(--board); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: clamp(26px, 3vw, 36px); line-height: 1.05; margin: 0; text-wrap: balance; }
.note p { margin: 0; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 22px; border-radius: 999px; background: var(--gold); color: #17140B; font-family: var(--board); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 16px; text-decoration: none; transition: transform .15s ease, background .15s ease; }
.btn:hover { background: #DBB65B; transform: translateY(-1px); }
.btn:focus-visible { outline: 3px solid var(--glyph); outline-offset: 3px; }
.btn svg { width: 18px; height: 18px; }
.hint { font-size: 14px; color: var(--muted); }

@media (max-width: 760px) {
  .stage { grid-template-columns: 1fr; }
  .side { order: -1; padding-bottom: 0; }
  .board { --bw: clamp(16px, 5.4vw, 30px); --sw: clamp(11px, 3.3vw, 18px); }
  .goldie { justify-content: center; }
  .goldie img { max-width: 260px; }
}
@media (prefers-reduced-motion: reduce) {
  .flap.go .ft, .flap.go .fb { animation: none; visibility: hidden; }
  .btn { transition: none; }
}
</style>

<script>
(function () {
  var CHARS = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:-.'/";
  var MAIN = ["FLIGHT DELAYED", "    DUE TO    ", " CONSTRUCTION "];
  var REMARKS = ["HARD HATS REQUIRED", "GATE 404 IS CLOSED", "PLEASE STAND BY", "GOLDIE IS ON IT", "MIND THE SCAFFOLD"];
  var SMALL_W = 18;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function makeCell(ch) {
    var f = document.createElement("span");
    f.className = "flap";
    f.innerHTML = '<span class="h t"><i></i></span><span class="h b"><i></i></span><span class="h ft"><i></i></span><span class="h fb"><i></i></span>';
    f._cur = ch;
    setFace(f, ch);
    return f;
  }
  function q(f, s) { return f.querySelector(s + " i"); }
  function setFace(f, ch) {
    var c = ch === " " ? " " : ch;
    q(f, ".t").textContent = c; q(f, ".b").textContent = c;
    f._cur = ch;
  }
  function flipOnce(f, to, ms) {
    var from = f._cur;
    var cf = from === " " ? " " : from, ct = to === " " ? " " : to;
    q(f, ".t").textContent = ct;
    q(f, ".ft").textContent = cf;
    q(f, ".b").textContent = cf;
    q(f, ".fb").textContent = ct;
    f.style.setProperty("--d", (ms / 2) + "ms");
    f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
    f._cur = to;
    setTimeout(function () { q(f, ".b").textContent = ct; f.classList.remove("go"); }, ms + 5);
  }
  function spinTo(f, target, delay) {
    clearTimeout(f._timer);
    if (reduce) { setFace(f, target); return; }
    var ti = CHARS.indexOf(target); if (ti < 0) ti = 0;
    var n = 4 + Math.floor(Math.random() * 9);
    var path = [];
    for (var k = n; k >= 1; k--) path.push(CHARS[(ti - k + CHARS.length * 4) % CHARS.length]);
    path.push(target);
    var step = 0, ms = 64;
    function tick() {
      if (step >= path.length) return;
      flipOnce(f, path[step++], ms);
      f._timer = setTimeout(tick, ms + 8);
    }
    f._timer = setTimeout(tick, delay);
  }
  function buildRow(container, text) {
    var cells = [];
    for (var i = 0; i < text.length; i++) { var c = makeCell(text[i]); container.appendChild(c); cells.push(c); }
    return cells;
  }
  function pad(s, w) { var l = Math.floor((w - s.length) / 2); return (Array(l + 1).join(" ") + s + Array(w + 1).join(" ")).slice(0, w); }

  var rowsEl = document.getElementById("rows");
  var mainCells = MAIN.map(function (t) { var r = document.createElement("div"); r.className = "row"; rowsEl.appendChild(r); return buildRow(r, t); });
  var remarkCells = buildRow(document.getElementById("remarks"), Array(SMALL_W + 1).join(" "));

  function refreshMain() {
    mainCells.forEach(function (row, r) {
      row.forEach(function (c, i) { spinTo(c, MAIN[r][i], r * 140 + i * 45 + Math.random() * 120); });
    });
  }
  var ri = 0;
  function nextRemark() {
    ri = (ri + 1) % REMARKS.length;
    var t = (REMARKS[ri] + Array(SMALL_W + 1).join(" ")).slice(0, SMALL_W);
    remarkCells.forEach(function (c, i) { spinTo(c, t[i], i * 40); });
  }
  // left-align remarks text at rest
  (function () { var t = (REMARKS[0] + Array(SMALL_W + 1).join(" ")).slice(0, SMALL_W); remarkCells.forEach(function (c, i) { setFace(c, t[i]); }); })();

  setTimeout(refreshMain, 450);
  if (!reduce) setInterval(nextRemark, 6500);
  var board = document.getElementById("board");
  board.addEventListener("click", function () { refreshMain(); nextRemark(); });
  board.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); refreshMain(); nextRemark(); } });

  var clock = document.getElementById("clock");
  function tickClock() { var d = new Date(); clock.textContent = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
  tickClock(); setInterval(tickClock, 15000);
})();
</script>
